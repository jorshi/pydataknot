[project]
name = "pydataknot"
version = "0.0.3"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "hydra-core>=1.3.7",
    "lightning>=2.6.0",
    "loguru>=0.7.3",
    "matplotlib>=3.9.4",
    "numpy>=2.0.2",
    "optuna-integration[pytorch-lightning]>=5.0.0",
    "optuna>=4.5.0",
    "rich>=15.0.0",
    "scikit-learn>=1.6.1",
    "torch>=2.8.0",
]

[project.scripts]
pydk-train = "pydataknot:train_classifier.main"
pydk-select = "pydataknot:feature_selection.main"
pydk-optimize = "pydataknot:optimize_classifier.main"
pydk-outlier = "pydataknot:outlier_detection.main"

[project.optional-dependencies]
dashboard = [
    "optuna-dashboard>=0.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pre-commit>=4.3.0",
    "pyfakefs>=5.9.3",
    "pytest-mock>=3.15.1",
    "pytest>=8.4.2",
    "ruff>=0.13.0",
]
